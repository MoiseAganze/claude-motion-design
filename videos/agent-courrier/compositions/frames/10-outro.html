  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="10-outro"]');
      const word = R.querySelector("#f10-word");
      "Agent Courrier".split("").forEach((ch, i) => {
        const s = document.createElement("span"); s.textContent = ch === " " ? " " : ch; if (i > 5) s.className = "b"; word.appendChild(s);

      // "Agent Courrier" → letter cascade
      R.querySelectorAll(".f10-word span").forEach((s, i) => {

      });
