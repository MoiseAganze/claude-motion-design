<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Space Grotesk"; src: url("assets/fonts/SpaceGrotesk-latin.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-latin.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    #root { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: hidden; color: #F4F6FB; font-family: "Inter", sans-serif; }
    .f05-bg { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 45%, #142150 0%, #070B18 72%); }
    .f05-pillwrap { position: absolute; left: 0; right: 0; top: 120px; display: flex; justify-content: center; }
    .f05-pill { position: relative; display: inline-flex; align-items: center; gap: 16px; padding: 18px 34px; border-radius: 100px; background: rgba(61,123,255,0.14); border: 2px solid rgba(61,123,255,0.45); font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 38px; color: #cfe0ff; }
    .f05-pill .spin { width: 30px; height: 30px; border-radius: 50%; border: 5px solid rgba(207,224,255,0.25); border-top-color: #3D7BFF; }
    .f05-pill.ok { background: #0f2a26; border-color: rgba(56,225,166,0.6); color: #38E1A6; }
    .f05-pilldone { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .f05-page { position: absolute; left: 160px; top: 250px; width: 760px; height: 1040px; border-radius: 10px; background: #ECE9E1; box-shadow: 0 30px 90px rgba(0,0,0,0.55); overflow: hidden; color: #20232b; font-family: "Inter", sans-serif; }
    .f05-grain { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.035) 0 2px, rgba(0,0,0,0) 2px 5px), repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0 1px, rgba(0,0,0,0) 1px 7px); mix-blend-mode: multiply; }
    .f05-l { position: absolute; left: 70px; right: 70px; font-size: 24px; line-height: 1.3; white-space: nowrap; }
    .f05-l b { font-weight: 700; }
    .f05-box { position: absolute; left: 58px; right: 58px; border: 2.5px solid #3D7BFF; border-radius: 6px; background: rgba(61,123,255,0.07); }
    .f05-beam { position: absolute; left: 100px; width: 880px; height: 8px; border-radius: 8px; background: #3D7BFF; box-shadow: 0 0 30px 10px rgba(61,123,255,0.65), 0 0 120px 30px rgba(124,92,255,0.35); }
    .f05-beamglow { position: absolute; left: 160px; width: 760px; height: 160px; background: linear-gradient(180deg, rgba(61,123,255,0), rgba(61,123,255,0.18)); }
  </style>

  <div id="root" data-composition-id="05-lecture" data-width="1080" data-height="1920" data-duration="4.404">
    <div id="f05-bg" class="f05-bg clip" data-start="0" data-duration="4.404" data-track-index="0"></div>
    <div id="f05-page" class="f05-page clip" data-start="0" data-duration="4.404" data-track-index="1">
      <div class="f05-grain"></div>
    </div>
    <div id="f05-scan" class="clip" data-start="0" data-duration="4.404" data-track-index="2" style="position:absolute;inset:0">
      <div class="f05-beamglow" id="f05-glow"></div>
      <div class="f05-beam" id="f05-beam"></div>
    </div>
    <div id="f05-pillwrap" class="f05-pillwrap clip" data-start="0" data-duration="4.404" data-track-index="3">
      <div class="f05-pill" id="f05-pill"><div class="spin" id="f05-spin"></div><span id="f05-reading">Lecture OCR…</span>
        <div class="f05-pilldone"><div class="f05-pill ok" id="f05-ok">Texte extrait ✓</div></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="05-lecture"]');
      const page = R.querySelector("#f05-page");
      // the fictional letter (same courrier as frames 4 & 6); [y, html, isKey]
      const LINES = [
        [70, "<b>SOCIÉTÉ LUMEN</b>", 1], [104, "12, avenue des Arts — 75011 Paris"], [138, "contact@lumen-studio.fr"],
        [230, "À l'attention de la Direction", 0], [300, "Paris, le 14 octobre 2026", 1],
        [380, "<b>Objet : Demande de partenariat</b>", 1],
        [460, "Madame, Monsieur,"], [520, "Nous souhaitons vous proposer un partenariat"], [556, "pour la numérisation de vos archives et"],
        [592, "la mise en place d'un accompagnement dédié."], [652, "Nous vous serions reconnaissants de bien vouloir"],
        [688, "nous indiquer vos disponibilités pour un premier"], [724, "rendez-vous dans les meilleurs délais."],
        [790, "Veuillez agréer nos salutations distinguées."], [880, "<b>Claire Martin</b>"], [914, "Directrice des partenariats"],
      ];
      const tl = gsap.timeline({ paused: true });
      const scanStart = 1.0, scanEnd = 3.2, pageTop = 250, pageH = 1040;
      tl.fromTo(page, { rotation: -3, y: 40, opacity: 0, scale: 0.96 }, { rotation: -2.5, y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      // "même un document scanné" → the sheet straightens as it is read
      tl.to(page, { rotation: 0, duration: 1.4, ease: "power2.inOut" }, 1.9);
      LINES.forEach(([y, html, key], i) => {
        const el = document.createElement("div");
        el.className = "f05-l"; el.id = "f05-l" + i; el.innerHTML = html; el.style.top = y + "px";
        page.appendChild(el);
        const t = scanStart + (y / pageH) * (scanEnd - scanStart) * 1.05;
        // unreadable scan → crisp text as the beam passes
        tl.fromTo(el, { filter: "blur(7px)", opacity: 0.45, color: "#7d7f86" }, { filter: "blur(0px)", opacity: 1, color: "#20232b", duration: 0.25, ease: "power2.out" }, t);
        if (key) {
          const box = document.createElement("div");
          box.className = "f05-box"; box.style.top = (y - 8) + "px"; box.style.height = "48px";
          page.appendChild(box);
          tl.fromTo(box, { opacity: 0, scaleX: 0.4, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, t + 0.05);
        }
      });
      tl.fromTo("#f05-beam", { y: pageTop + 10, opacity: 0 }, { y: pageTop + pageH - 20, opacity: 1, duration: scanEnd - scanStart, ease: "none" }, scanStart);
      tl.fromTo("#f05-glow", { y: pageTop - 150, opacity: 0 }, { y: pageTop + pageH - 170, opacity: 1, duration: scanEnd - scanStart, ease: "none" }, scanStart);
      tl.to(["#f05-beam", "#f05-glow"], { opacity: 0, duration: 0.25, ease: "power2.out" }, scanEnd);
      // status pill
      tl.fromTo("#f05-pill", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.55);
      tl.fromTo("#f05-spin", { rotation: 0 }, { rotation: 900, duration: 2.7, ease: "none" }, 0.55);
      tl.to(["#f05-reading", "#f05-spin"], { opacity: 0, duration: 0.15 }, 3.25);
      tl.fromTo("#f05-ok", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 3.3);
      window.__timelines = window.__timelines || {};
      window.__timelines["05-lecture"] = tl;
    })();
  </script>
</template>
