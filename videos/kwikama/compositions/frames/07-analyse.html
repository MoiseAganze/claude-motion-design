      tl.to(cam, { ...KIT.cam(720, 440, 1.36), duration: 5.6, ease: "sine.inOut" }, 15.6);

      KIT.camTo(tl, cam, 1088, 360, 1.2, 21.5, 0.9);
      KIT.mark(tl, M.signal[0], 22.2, 2.3);
