<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #031829; }
    .f10-full { position: absolute; inset: 0; }
    .f10-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    .f10-shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .f10-off { opacity: 0; }
  </style>

  <div id="root" data-composition-id="f10-recouvrement" data-width="1920" data-height="1080">
    <div id="f10-stage" class="f10-full clip" data-start="0" data-duration="12.74" data-track-index="0">
      <div id="f10-cam" class="f10-cam" data-layout-allow-overflow data-layout-allow-overlap>
        <div id="f10-a" class="f10-full"></div>
        <img id="f10-gele" class="f10-shot f10-off" src="capture/f10/panel-gele.png" alt="" />
        <img id="f10-saisi" class="f10-shot f10-off" src="capture/f10/panel-saisi.png" alt="" />
        <div id="f10-b" class="f10-full f10-off"></div>
        <div id="f10-fx"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="f10-recouvrement"]');
      const q = (s) => R.querySelector(s);
      const cam = q("#f10-cam");
      const A = KIT.page(q("#f10-a"), "f10-pa", "capture/f10/encart.png", "capture/f10/tall.png", 1969);
      const B = KIT.page(q("#f10-b"), "f10-pb", "capture/f10/encart-after.png", "capture/f10/tall-after.png", 1969);
      const T = (x) => ({ x, y: 528, w: 388, h: 123 });
      const tiles = [[288, 0.6], [692, 1.7], [1096, 2.5], [1500, 3.18]].map(([x, t], i) => { const m = KIT.box("f10-m-t" + i, T(x), 4); A.layer.appendChild(m); return [m, t]; });
      const after = [692, 1096].map((x, i) => { const m = KIT.box("f10-m-a" + i, T(x), 4); B.layer.appendChild(m); return m; });
      const quote = KIT.box("f10-m-quote", { x: 323, y: 324, w: 876, h: 35 }, 8); B.layer.appendChild(quote);
      const sess = KIT.box("f10-m-sess", { x: 12, y: 801, w: 231, h: 112 }, 4); q("#f10-fx").appendChild(sess);
      const k = KIT.mount(q("#f10-fx"), "f10");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f10-stage", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 0);
      tl.fromTo([A.scroll, B.scroll], { y: 0 }, { y: 0, duration: 0.01 }, 0);
      tl.fromTo(cam, KIT.cam(1088, 560, 1.08), { ...KIT.cam(1088, 590, 1.12), duration: 4.8, ease: "power1.inOut" }, 0);
      // « Identifié. Gelé. Saisi. Confisqué. Restitué. » — one status per word
      tiles.forEach(([m, t]) => KIT.mark(tl, m, t, 4.6 - t));
      // « Chaque bien est suivi jusqu'au tableau de bord financier de l'État. » — AVR-2026-072: Gelé → Saisi
      KIT.scrollTo(tl, A, 300, 4.9, 0.9);
      KIT.camTo(tl, cam, 960, 540, 1, 4.9, 0.9);
      KIT.cursorAt(tl, k, 1150, 700, 5.0);
      KIT.move(tl, k, 700, 837, 5.15, 0.75);
      KIT.click(tl, k, 700, 837, 6.0);
      KIT.show(tl, "#f10-gele", 6.06, 0.3);
      KIT.move(tl, k, 1653, 1043, 6.2, 0.7);
      KIT.click(tl, k, 1653, 1043, 7.0);
      KIT.show(tl, "#f10-saisi", 7.06, 0.25);
      // panel closed: the two totals have moved (Gelés 6 880 000 → 4 140 000, Saisis 3 896 000 → 6 636 000)
      tl.set(B.scroll, { y: -300 }, 7.6);
      KIT.show(tl, "#f10-b", 7.7, 0.4);
      KIT.hide(tl, k, 7.7);
      after.forEach((m) => KIT.mark(tl, m, 8.0, 1.1));
      KIT.mark(tl, sess, 8.1, 1.2);
      // « Une enquête qui ne récupère rien n'a rien réparé. » — the panel's own words
      KIT.scrollTo(tl, B, 0, 8.75, 0.9);
      KIT.camTo(tl, cam, 760, 360, 1.3, 8.75, 1.0);
      KIT.mark(tl, quote, 9.45, null);

      window.__timelines["f10-recouvrement"] = tl;
    })();
  </script>
