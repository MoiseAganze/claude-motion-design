<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #031829; }
    .f04-full { position: absolute; inset: 0; }
    .f04-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
    .f04-shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .f04-off { opacity: 0; }
  </style>

  <div id="root" data-composition-id="f04-saisine" data-width="1920" data-height="1080">
    <div id="f04-stage" class="f04-full clip" data-start="0" data-duration="25.88" data-track-index="0">
      <div id="f04-cam" class="f04-cam" data-layout-allow-overflow data-layout-allow-overlap>
        <img id="f04-list" class="f04-shot" src="capture/f04/list.png" alt="" />
        <img id="f04-bottom" class="f04-shot f04-off" src="capture/f04/list-bottom.png" alt="" />
        <img id="f04-c0" class="f04-shot f04-off" src="capture/f04/panel-controls-0.png" alt="" />
        <img id="f04-c1" class="f04-shot f04-off" src="capture/f04/panel-controls-1.png" alt="" />
        <img id="f04-c2" class="f04-shot f04-off" src="capture/f04/panel-controls-2.png" alt="" />
        <img id="f04-c3" class="f04-shot f04-off" src="capture/f04/panel-controls-3.png" alt="" />
        <img id="f04-c4" class="f04-shot f04-off" src="capture/f04/panel-controls-4.png" alt="" />
        <img id="f04-done" class="f04-shot f04-off" src="capture/f04/validated.png" alt="" />
        <img id="f04-reg" class="f04-shot f04-off" src="capture/f04/registre.png" alt="" />
        <div id="f04-fx"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const R = document.querySelector('[data-composition-id="f04-saisine"]');
      const q = (s) => R.querySelector(s);
      const fx = q("#f04-fx");
      const M = {
        callout: KIT.box("f04-m-callout", { x: 327, y: 249, w: 1544, h: 45 }, 10),
        row: KIT.box("f04-m-row", { x: 288, y: 955, w: 1600, h: 123 }, 4),
        nums: KIT.box("f04-m-nums", { x: 300, y: 330, w: 124, h: 596 }, 6),
        session: KIT.box("f04-m-session", { x: 12, y: 800, w: 231, h: 130 }, 4),
      };
      Object.values(M).forEach((m) => fx.appendChild(m));
      const k = KIT.mount(fx, "f04");
      const cam = q("#f04-cam");
      const P = [[1430, 398], [1430, 530], [1496, 683], [1430, 815]];

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#f04-stage", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, 0);
      // « …saisie par la CENAREF, un juge d'instruction, le ministère public, la presse, un sonneur d'alerte… » — written on screen
      tl.fromTo(cam, KIT.cam(1099, 300, 1.05), { ...KIT.cam(1099, 300, 1.2), duration: 8.8, ease: "power1.inOut" }, 0);
      KIT.mark(tl, M.callout, 0.6, 8.1);
      // « Avant toute enquête, la régularité de cette saisine est établie. »
      KIT.show(tl, "#f04-bottom", 9.0, 0.5);
      KIT.camTo(tl, cam, 1088, 760, 1.1, 9.0, 1.1);
      KIT.cursorAt(tl, k, 1250, 700, 9.3);
      KIT.move(tl, k, 700, 985, 9.5, 0.9);
      KIT.click(tl, k, 700, 985, 10.55);
      KIT.show(tl, "#f04-c0", 10.62, 0.35);
      KIT.camTo(tl, cam, 1640, 600, 1.45, 11.2, 1.3);
      // one control per question, on the word that asks it
      const picks = [[14.55, "#f04-c1"], [17.25, "#f04-c2"], [19.2, "#f04-c3"], [20.35, "#f04-c4"]];
      picks.forEach(([t, img], i) => {
        KIT.move(tl, k, P[i][0], P[i][1], t - (i === 3 ? 0.75 : 0.95), i === 3 ? 0.65 : 0.85);
        KIT.click(tl, k, P[i][0], P[i][1], t);
        KIT.show(tl, img, t + 0.05, 0.15);
      });
      // « Ce n'est qu'ensuite que le dossier est ouvert… »
      KIT.camTo(tl, cam, 1640, 900, 1.45, 20.6, 0.8);
      KIT.move(tl, k, 1817, 1043, 20.75, 0.75);
      KIT.click(tl, k, 1817, 1043, 21.6);
      KIT.show(tl, "#f04-done", 21.68, 0.35);
      KIT.hide(tl, k, 21.9);
      KIT.camTo(tl, cam, 1088, 760, 1.1, 21.85, 0.9);
      KIT.mark(tl, M.row, 22.2, 0.95);
      // « …numéroté, inscrit au registre central. »
      KIT.show(tl, "#f04-reg", 23.0, 0.45);
      KIT.camTo(tl, cam, 960, 540, 1, 23.0, 0.9);
      KIT.mark(tl, M.nums, 23.3, null);
      KIT.mark(tl, M.session, 24.0, null);

      window.__timelines["f04-saisine"] = tl;
    })();
  </script>
</template>
